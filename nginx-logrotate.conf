/var/log/nginx/private/access.log /var/log/nginx/private/events.log /var/log/nginx/private/error.log /var/log/nginx/private/legacy.log {
    daily
    maxsize 1M
    rotate 30
    maxage 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d-%H%M%S
    create 0600 nginx nginx
    sharedscripts
    postrotate
        if [ -f /tmp/nginx.pid ]; then
            kill -USR1 "$(cat /tmp/nginx.pid)"
        fi
    endscript
}
