# Apenas arquivos públicos explicitamente aprovados nesta versão.
map $uri $lp_public_file {
    default 0;
    / 1;
    /index.html 1;
    /styles.css 1;
    /app.js 1;
    ~^/lp-events/(ads-tagged|unattributed)/(page-view|hero|individual|familia|duvidas|academia|consulta|garantia|faq|final|rodape|fixo|topo)$ 1;
    /robots.txt 1;
    /sitemap.xml 1;
    /comprar 1;
    /comprar/ 1;
    /comprar/confirmacao 1;
    /comprar/checkout.css 1;
    /comprar/checkout.js 1;
    /comprar/api/session 1;
    /comprar/api/create 1;
    /comprar/api/status 1;
    /comprar/api/qr 1;
    /assets/favicon.svg 1;
    /assets/og-1200x630.jpg 1;
    /assets/entrada-480.webp 1;
    /assets/entrada-800.webp 1;
    /assets/entrada-1280.webp 1;
    /assets/checkin-480.webp 1;
    /assets/checkin-800.webp 1;
    /assets/checkin-1280.webp 1;
    /assets/academia-480.webp 1;
    /assets/academia-800.webp 1;
    /assets/academia-1280.webp 1;
    /assets/treino-480.webp 1;
    /assets/treino-800.webp 1;
    /assets/treino-1280.webp 1;
}

# Public access reaches this origin through Cloudflare; the local port is loopback-only.
map $http_cf_connecting_ip $checkout_client { default $http_cf_connecting_ip; "" $binary_remote_addr; }
limit_req_zone $checkout_client zone=checkout_api:10m rate=2r/s;
limit_req_zone $checkout_client zone=checkout_create:10m rate=5r/m;
map "$request_method:$uri" $lp_method_allowed {
    default 0;
    ~^GET: 1;
    ~^HEAD: 1;
    "POST:/comprar/api/create" 1;
    ~^POST:/lp-events/(ads-tagged|unattributed)/(page-view|hero|individual|familia|duvidas|academia|consulta|garantia|faq|final|rodape|fixo|topo)$ 1;
}

# Não registrar query strings, referer, cookies ou Authorization.
log_format lp_privacy escape=json '{"time":"$time_iso8601","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"peer":"$remote_addr",'
    '"cf_client":"$http_cf_connecting_ip","cf_ray":"$http_cf_ray",'
    '"ua":"$http_user_agent"}';
log_format lp_event_privacy escape=json '{"time":"$time_iso8601","event":"$uri","status":$status}';

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/private/access.log lp_privacy;
    return 404;
}

# Endereço canônico sem www: evita conteúdo duplicado nos buscadores.
server {
    listen 80;
    server_name www.acessosfitness.online;
    server_tokens off;
    access_log /var/log/nginx/private/access.log lp_privacy;
    return 301 https://acessosfitness.online$request_uri;
}

server {
    listen 80;
    server_name acessosfitness.online localhost 127.0.0.1;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/private/access.log lp_privacy;
    autoindex off;
    client_max_body_size 16k;

    if ($lp_method_allowed = 0) { return 405; }
    if ($lp_public_file = 0) { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control "no-cache";

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml;

    location ~ ^/lp-events/(ads-tagged|unattributed)/(page-view|hero|individual|familia|duvidas|academia|consulta|garantia|faq|final|rodape|fixo|topo)$ {
        if ($request_method != POST) { return 405; }
        access_log /var/log/nginx/private/events.log lp_event_privacy;
        return 204;
    }

    location = /comprar { rewrite ^ /comprar/ last; }
    location = /comprar/confirmacao { rewrite ^ /comprar/ last; }
    location = /comprar/ {
        try_files /comprar/index.html =404;
        add_header Cache-Control "no-store, private" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    }
    location = /comprar/api/create {
        limit_req zone=checkout_create burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://checkout:8000;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_hide_header Server;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, private" always;
    }
    location /comprar/api/ {
        limit_req zone=checkout_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://checkout:8000;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_hide_header Server;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store, private" always;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n\nSitemap: https://acessosfitness.online/sitemap.xml\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header Cache-Control "public, max-age=3600";
    }
}
